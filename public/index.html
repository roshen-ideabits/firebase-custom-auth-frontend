<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auth Frontend</title>
    <link rel="stylesheet" href="/styles.css" />
    <script>
      window.AUTH_API_BASE_URL = window.AUTH_API_BASE_URL || 'http://localhost:4000';
    </script>
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Firebase Auth Demo</h1>
        <p>Switch between register and login to call the auth-backend.</p>
      </header>

      <section class="card">
        <div class="toggle">
          <button id="show-login" class="active" type="button">Login</button>
          <button id="show-register" type="button">Register</button>
        </div>

        <form id="login-form" class="visible" autocomplete="off">
          <label>
            Email
            <input type="email" name="email" required />
          </label>
          <label>
            Password
            <input type="password" name="password" required />
          </label>
          <button type="submit">Login</button>
        </form>

        <form id="register-form" autocomplete="off">
          <label>
            Email
            <input type="email" name="email" required />
          </label>
          <label>
            Password
            <input type="password" name="password" minlength="6" required />
          </label>
          <label>
            Display name (optional)
            <input type="text" name="displayName" />
          </label>
          <button type="submit">Register</button>
        </form>

        <div id="feedback" class="feedback" role="status"></div>
      </section>
    </main>

    <script src="/main.js" type="module"></script>
  </body>
</html>
